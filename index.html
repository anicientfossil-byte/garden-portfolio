<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Portfolio</title>
<style>
  :root{--ink:#fff}
  *{box-sizing:border-box;margin:0}
  html,body{background:#0d140d;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
  #track{height:1200vh}
  #stage{position:fixed;inset:0;overflow:hidden}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;touch-action:pan-y!important}
  #loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0d140d;
    letter-spacing:.2em;font-size:.95rem;text-transform:uppercase;transition:opacity .8s}
  #loader.done{opacity:0;pointer-events:none}
  #hint{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;z-index:10;text-align:center;
    font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;opacity:.65;text-shadow:0 1px 8px #000;
    pointer-events:none;transition:opacity .6s}
  .hotspot{position:fixed;z-index:10;transform:translate(-50%,-50%);display:flex;align-items:center;gap:14px;
    color:#fff;text-decoration:none;opacity:0;pointer-events:none;transition:opacity .7s}
  .hotspot.active{opacity:1;pointer-events:auto}
  .rings{position:relative;width:34px;height:34px;flex:none}
  .rings i{position:absolute;inset:0;border:1.5px solid #fff;border-radius:50%;animation:pulse 2.8s ease-out infinite}
  .rings i:nth-child(2){animation-delay:.9s}.rings i:nth-child(3){animation-delay:1.8s}
  .rings::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
  @keyframes pulse{0%{transform:scale(.4);opacity:.95}100%{transform:scale(1.9);opacity:0}}
  .label{padding:9px 16px;border-radius:999px;background:rgba(10,16,10,.45);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);font-size:.85rem;letter-spacing:.08em;white-space:nowrap}
  @media (max-width:600px){.label{font-size:.75rem;padding:7px 12px}}
  #contact{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(8,12,8,.72);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s}
  #contact.open{opacity:1;pointer-events:auto}
  #contact .box{max-width:min(920px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;transform:translateY(12px);transition:transform .4s}
  #contact.open .box{transform:none}
  #contact img{max-width:100%;max-height:68vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #contact .calls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #contact .calls a,#contact button{color:#fff;text-decoration:none;font:inherit;font-size:.85rem;letter-spacing:.08em;padding:9px 16px;
    border-radius:999px;background:rgba(10,16,10,.5);border:1px solid rgba(255,255,255,.3);cursor:pointer}
  .ld{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px;text-align:center}
  #line{font-style:italic;font-size:1.25rem;letter-spacing:.02em;text-transform:none;min-height:1.6em;transition:opacity .5s}
  .bar{width:min(240px,60vw);height:2px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
  #pct{font-size:.72rem;opacity:.6}
  #ver{position:fixed;left:10px;bottom:6px;z-index:40;font:10px/1 sans-serif;opacity:.35;pointer-events:none}
</style>
</head>
<body>
<div id="loader"><div class="ld"><div id="line">A little cat is waking up in the garden…</div><div class="bar"><i id="bar"></i></div><span id="pct">Loading Garden... 0%</span></div></div>
<div id="track"></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ver">v5</div>
<div id="hint">Scroll to explore • Move mouse to stir the wind</div>
<a class="hotspot" id="hs0" target="_blank" rel="noopener"><span class="rings"><i></i><i></i><i></i></span><span class="label"></span></a>
<a class="hotspot" id="hs1" target="_blank" rel="noopener"><span class="rings"><i></i><i></i><i></i></span><span class="label"></span></a>
<a class="hotspot" id="hs2" target="_blank" rel="noopener"><span class="rings"><i></i><i></i><i></i></span><span class="label"></span></a>

<div id="contact" aria-hidden="true"><div class="box"><img id="cimg" alt="Contact card"><div class="calls" id="calls"></div><button id="cclose">Close</button></div></div>

<script>addEventListener("error",function(e){window.__err=1;var l=document.getElementById("line");if(l){l.style.opacity=1;l.textContent="Oops: "+(e.message||"a file failed to load");}},true);</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js" onerror="window.__err=0;document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js&quot;><\/script>'.replace(/&quot;/g,String.fromCharCode(34)))"></script>
<script>
/* ===== CONFIG ===== */
const TOTAL_FRAMES = 674;            // frames/frame_001.jpg … frame_674.jpg
const FRAME_PATH = n => `frames/frame_${String(n).padStart(3,"0")}.jpg`;
const LERP = 0.1;
// Phones can't hold 674 full-size decoded frames, so they load every 5th frame, shrunk
const MOBILE = matchMedia("(pointer:coarse)").matches || Math.min(innerWidth,innerHeight) < 700;
const STRIDE = MOBILE ? 5 : 1;
const LOADED = Math.ceil(TOTAL_FRAMES/STRIDE);
const FW = MOBILE ? 640 : 1280, FH = MOBILE ? 360 : 720;
const REVEAL = Math.min(LOADED, MOBILE ? 24 : 60);   // frames needed before the page opens; the rest keep loading behind it
const LINES = ["A little cat is waking up in the garden…","Brushing the morning dew off every leaf…","Teaching the breeze where to blow…","Almost there — the path is ready to be walked."];
const CONTACT_IMG = "contact.jpg";
const PHONES = ["+918980989667","+9779703310653"];
// modal:true = opens the contact card (CONTACT_IMG) instead of a link. start/end = scroll depth 0–1. top/left = % of viewport.
const HOTSPOTS = [
  {el:"hs0", label:"My Main Website",  url:"https://anicientfossil-byte.github.io/VibeCapsule/", start:.04, end:.28, top:40, left:16},
  {el:"hs1", label:"Featured Project", url:"https://www.instagram.com/supportmyfincatapp/", start:.36, end:.52, top:38, left:62},
  {el:"hs2", label:"Get In Touch",     url:"#contact", modal:true, start:.64, end:.88, top:30, left:55}
];

/* ===== SETUP ===== */
const canvas = document.getElementById("c");
const hint = document.getElementById("hint");
const images = new Array(LOADED);
let target = 0, current = 0, ready = false;

HOTSPOTS.forEach(h=>{
  const a = document.getElementById(h.el);
  a.href = h.url; a.querySelector(".label").textContent = h.label;
  a.style.top = h.top+"%"; a.style.left = h.left+"%";
  h.node = a;
  if(h.modal) a.addEventListener('click',e=>{e.preventDefault();openContact();});
});

/* ===== PIXI (wind displacement) ===== */
const app = new PIXI.Application({view:canvas, resizeTo:window, backgroundColor:0x0d140d,
  antialias:false, resolution:Math.min(devicePixelRatio||1, MOBILE?1.5:2), autoDensity:true});
app.ticker.stop();
canvas.style.touchAction = "pan-y";      // Pixi sets touch-action:none, which blocks finger-scrolling on phones
canvas.style.pointerEvents = "none";                         // we drive rendering from our own rAF loop
const fc = document.createElement("canvas"); fc.width = FW; fc.height = FH;
const fx = fc.getContext("2d");
const frameTex = PIXI.Texture.from(fc);      // one reusable texture, no per-frame GPU leak
const sprite = new PIXI.Sprite(frameTex);
function paint(img){ fx.drawImage(img,0,0,FW,FH); frameTex.baseTexture.update(); }
app.stage.addChild(sprite);

// Procedural noise map for the displacement filter
const nc = document.createElement("canvas"); nc.width = nc.height = 256;
const nx = nc.getContext("2d"), nd = nx.createImageData(256,256);
for(let i=0;i<nd.data.length;i+=4){
  const v = 128 + 127*Math.sin((i/4%256)*.09)*Math.cos(((i/4/256)|0)*.11) + (Math.random()-.5)*40;
  nd.data[i]=v; nd.data[i+1]=255-v*.6; nd.data[i+2]=128; nd.data[i+3]=255;
}
nx.putImageData(nd,0,0);
const noiseTex = PIXI.Texture.from(nc);
noiseTex.baseTexture.wrapMode = PIXI.WRAP_MODES.REPEAT;
const noise = new PIXI.Sprite(noiseTex);
noise.width = 3200; noise.height = 2200; noise.anchor.set(.5);
app.stage.addChild(noise); noise.alpha = 0;
const disp = new PIXI.DisplacementFilter(noise, 0);
sprite.filters = [disp];

/* Wind state with spring damping */
const wind = {x:0,y:0,vx:0,vy:0,px:null,py:null,energy:0,energyV:0,energyT:0};
addEventListener("mousemove", e=>{
  if(wind.px!==null){
    wind.vx += (e.clientX-wind.px)*.35; wind.vy += (e.clientY-wind.py)*.35;
    wind.energyT = Math.min(1, wind.energyT + Math.hypot(e.clientX-wind.px,e.clientY-wind.py)/180);
  }
  wind.px=e.clientX; wind.py=e.clientY;
  wind.mx=e.clientX; wind.my=e.clientY;
});

/* touch = wind on phones too */
addEventListener("touchmove",e=>{const t=e.touches[0]; if(!t) return;
  if(wind.px!==null){wind.vx+=(t.clientX-wind.px)*.35; wind.vy+=(t.clientY-wind.py)*.35;
    wind.energyT=Math.min(1,wind.energyT+Math.hypot(t.clientX-wind.px,t.clientY-wind.py)/180);}
  wind.px=t.clientX; wind.py=t.clientY; wind.mx=t.clientX; wind.my=t.clientY;},{passive:true});
addEventListener("touchend",()=>{wind.px=null;});

/* ===== LAYOUT: cover-fit frame (no stretching on any aspect ratio) ===== */
function fit(){
  const sw=app.screen.width, sh=app.screen.height, s=Math.max(sw/FW, sh/FH);
  sprite.width = FW*s; sprite.height = FH*s;
  sprite.position.set((sw-sprite.width)/2,(sh-sprite.height)/2);
}
addEventListener("resize", ()=>setTimeout(fit,50));

/* ===== PRELOADER ===== */
async function shrink(im){
  if(!MOBILE) return im;
  const c = document.createElement("canvas"); c.width = FW; c.height = FH;   // small canvas keeps phone memory low
  c.getContext("2d").drawImage(im,0,0,FW,FH);
  return c;
}
function load(k){
  return new Promise(res=>{
    const n = k===LOADED-1 ? TOTAL_FRAMES : k*STRIDE+1;
    const im = new Image(); im.decoding="async";
    im.onload = async ()=>{ images[k]=await shrink(im); res(); };
    im.onerror = ()=>{ images[k]=images[k-1]||null; res(); };
    im.src = FRAME_PATH(n);
  });
}
const lineEl = document.getElementById("line");
let li = 0;
const lineTimer = setInterval(()=>{ if(window.__err) return; lineEl.style.opacity = 0;
  setTimeout(()=>{ li=(li+1)%LINES.length; lineEl.textContent=LINES[li]; lineEl.style.opacity=1; },500); },2600);

(async function preload(){
  await load(0);                              // frame 1 first: the painting is ready the moment the loader lifts
  paint(images[0]); fit(); app.render();
  let done = 1;
  const pct = document.getElementById("pct"), bar = document.getElementById("bar");
  function reveal(){
    if(ready) return; ready = true; clearInterval(lineTimer);
    pct.textContent = "Loading Garden... 100%"; bar.style.width = "100%";
    app.render(); document.getElementById("loader").classList.add("done");
  }
  const q = [...Array(LOADED-1).keys()].map(i=>i+1);   // in journey order, so the start arrives first
  async function worker(){
    while(q.length){ await load(q.shift()); done++;
      if(!ready){ const p = Math.min(100, Math.floor(done/REVEAL*100));
        pct.textContent = `Loading Garden... ${p}%`; bar.style.width = p+"%";
        if(done>=REVEAL) reveal(); } }
  }
  await Promise.all(Array.from({length: MOBILE?6:10}, worker));
  reveal();
})();

/* ===== RENDER LOOP ===== */
let shown = -1;
function tick(){
  requestAnimationFrame(tick);
  if(!ready) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max>0 ? Math.min(1, Math.max(0, scrollY/max)) : 0;
  target = p*(LOADED-1);
  current += (target-current)*LERP;
  if(Math.abs(target-current)<.001) current = target;

  let a = MOBILE ? Math.floor(current) : Math.round(current);
  while(a>0 && !images[a]) a--;             // frames still arriving: show the nearest loaded one
  const b = Math.min(LOADED-1, Math.floor(current)+1);
  const f = (MOBILE && images[b] && b!==a) ? Math.round((current-Math.floor(current))*8)/8 : 0;
  const key = a+":"+f;
  if(key!==shown && images[a]){
    shown = key;
    fx.globalAlpha = 1; fx.drawImage(images[a],0,0,FW,FH);
    if(f>0){ fx.globalAlpha = f; fx.drawImage(images[b],0,0,FW,FH); fx.globalAlpha = 1; }
    frameTex.baseTexture.update();
  }

  // wind spring: velocity eases back to rest, displacement settles to 0
  wind.x += wind.vx*.02; wind.y += wind.vy*.02;
  wind.vx *= .90; wind.vy *= .90;
  wind.x += (0-wind.x)*.06; wind.y += (0-wind.y)*.06;
  wind.energyV += (wind.energyT-wind.energy)*.08; wind.energyV *= .82;
  wind.energy += wind.energyV; wind.energyT *= .94;
  const t = performance.now()*.0012;
  disp.scale.x = Math.max(-28,Math.min(28, wind.x*.8 + Math.sin(t*3)*wind.energy*8));
  disp.scale.y = Math.max(-28,Math.min(28, wind.y*.8 + Math.cos(t*2.4)*wind.energy*8));
  noise.x = app.screen.width/2 + Math.sin(t)*120 + ((wind.mx||0)-app.screen.width/2)*.1; noise.y = app.screen.height/2 + Math.cos(t*.8)*90;
  app.render();

  // hotspots + hint
  HOTSPOTS.forEach(h=>h.node.classList.toggle("active", p>=h.start && p<=h.end));
  hint.style.opacity = p>.03 ? 0 : .65;
}
/* ===== CONTACT CARD ===== */
const contactEl = document.getElementById("contact");
document.getElementById("cimg").src = CONTACT_IMG;
document.getElementById("calls").innerHTML = PHONES.map(p=>`<a href="tel:${p}">${p}</a>`).join("");
function openContact(){ contactEl.classList.add("open"); }
function closeContact(){ contactEl.classList.remove("open"); }
document.getElementById("cclose").onclick = closeContact;
contactEl.addEventListener("click",e=>{ if(e.target===contactEl) closeContact(); });
addEventListener("keydown",e=>{ if(e.key==="Escape") closeContact(); });
tick();
</script>
</body>
</html>
